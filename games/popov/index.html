<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Худшая Группа Попова</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <!-- Сцена -->
    <div id="scene">
      <img id="bg-front" class="bg active" alt="">
      <img id="bg-back" class="bg" alt="">
      <div id="actors"></div>
      <div id="turn-zone" title="Посмотреть на другую сторону"><span>↻ Обернуться</span></div>
      <div id="hotspots"></div>
    </div>

    <!-- HUD -->
    <div id="hud">
      <div id="avatar">
        <img id="avatar-img" alt="Д.В.Попов">
      </div>

      <div id="shock">
        <div id="shock-label">Уровень ошеломления</div>
        <div id="shock-track">
          <div id="shock-fill"></div>
          <div id="shock-segments"></div>
        </div>
        <div id="shock-head"><img id="shock-head-img" alt=""></div>
        <div id="shock-float"></div>
        <div id="day-info"></div>
      </div>

      <div id="top-buttons">
        <button id="btn-turn" class="top-btn" title="Повернуться (Tab)">↻ <span>Ракурс</span><i id="turn-alert">!</i></button>
        <button id="btn-menu" class="top-btn" title="Меню (Esc)">☰ <span>Меню</span></button>
      </div>

      <div id="cards"></div>
      <div id="choices"></div>

      <div id="dialog">
        <div id="dialog-name"></div>
        <div id="dialog-text"></div>
        <div id="dialog-controls">
          <button data-ctl="auto"><b>▶</b> AUTO</button>
          <button data-ctl="log"><b>☰</b> LOG</button>
          <button data-ctl="skip"><b>⏩</b> SKIP</button>
        </div>
        <div id="dialog-next">▼</div>
      </div>
    </div>

    <!-- Экраны -->
    <div id="title-screen" class="screen">
      <div id="title-slides"></div>
      <div class="title-shade"></div>
      <div class="title-box">
        <div class="title-avatar"><img id="title-head" alt=""></div>
        <h1>Худшая Группа</h1>
        <h2>Попова</h2>
        <p class="title-tag">Визуальная новелла о тотальном разочаровании</p>
        <div class="title-buttons">
          <button class="big-btn" id="btn-start"><span id="btn-start-label">Начать</span><small id="btn-start-sub"></small></button>
          <button class="big-btn ghost" id="btn-days">Выбрать день<small id="btn-days-sub"></small></button>
          <button class="big-btn ghost" id="btn-title-settings">Настройки</button>
        </div>
        <div id="day-select"><div id="day-list"></div></div>
      </div>

      <button class="credits-link" id="btn-credits">Разработчики</button>

      <div id="credits">
        <div class="credits-box">
          <button class="close-btn" id="credits-close">✕</button>
          <div class="credits-title">Разработчики</div>
          <div class="credits-body">
            <figure class="credits-person"><img id="credits-left" alt=""><figcaption id="credits-left-name"></figcaption></figure>
            <ul id="credits-list"></ul>
            <figure class="credits-person"><img id="credits-right" alt=""><figcaption id="credits-right-name"></figcaption></figure>
          </div>
        </div>
      </div>
    </div>

    <div id="day-card" class="screen">
      <div class="day-card-inner">
        <div id="day-card-num"></div>
        <div id="day-card-topic"></div>
      </div>
    </div>

    <div id="result-screen" class="screen">
      <div class="result-box">
        <div id="result-kicker"></div>
        <div id="result-grade"></div>
        <div id="result-stars"></div>
        <div id="result-text"></div>
        <div id="result-stats"></div>
        <div id="result-buttons"></div>
      </div>
    </div>

    <!-- Меню -->
    <div id="menu" class="modal">
      <div class="menu-panel">
        <div class="menu-head">
          <div class="menu-tabs">
            <button data-tab="history" class="active">История</button>
            <button data-tab="settings">Настройки</button>
          </div>
          <button class="close-btn" id="menu-close">✕</button>
        </div>
        <div class="menu-body">
          <div id="tab-history" class="tab active">
            <div id="history-list"></div>
          </div>
          <div id="tab-settings" class="tab">
            <label class="setting">
              <span>Скорость текста</span>
              <input type="range" id="set-speed" min="10" max="120" step="5">
              <em id="set-speed-val"></em>
            </label>
            <label class="setting">
              <span>Пауза в режиме AUTO</span>
              <input type="range" id="set-auto" min="0.5" max="4" step="0.25">
              <em id="set-auto-val"></em>
            </label>
            <label class="setting check">
              <input type="checkbox" id="set-odds">
              <span>Показывать шансы и очки на карточках вопросов</span>
            </label>
            <label class="setting check">
              <input type="checkbox" id="set-answer">
              <span>Показывать правильный ответ после ошибки</span>
            </label>
            <label class="setting check">
              <input type="checkbox" id="set-shake">
              <span>Тряска экрана при сильном шоке</span>
            </label>
            <div class="setting-hint">
              Клавиши: <b>Пробел / Enter</b> — дальше, <b>1–3</b> — выбор вопроса,
              <b>Tab</b> — сменить ракурс, <b>Ctrl</b> — промотка, <b>L</b> — история, <b>Esc</b> — меню.
            </div>
            <div class="setting reset">
              <span>Прогресс: открытые дни и лучшие оценки</span>
              <button class="big-btn ghost small" id="btn-reset-progress">Сбросить</button>
            </div>
          </div>
        </div>
        <div class="menu-foot">
          <button class="big-btn ghost small" id="btn-to-title">Главное меню</button>
          <button class="big-btn small" id="btn-resume">Продолжить</button>
        </div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
